name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Scaffold & Configure Build
        run: |
          flutter create --platforms=android --org com.cep.cybersafe .
          
          # Android permissions inject karein
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              c = f.read()
          perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          c = c.replace("<application", perms + "\n    <application")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(c)
          '
          
          # Core Library Desugaring aur MultiDex enable karein
          python3 -c '
          import os
          # Handle build.gradle ya build.gradle.kts
          target_file = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          with open(target_file, "r") as f:
              code = f.read()
          
          if target_file.endswith(".kts"):
              code = code.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              code = code.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true")
              code += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
          else:
              code = code.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              code = code.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true")
              code += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n"
          
          with open(target_file, "w") as f:
              f.write(code)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Safe-CEP-App
          path: build/app/outputs/flutter-apk/app-release.apk
