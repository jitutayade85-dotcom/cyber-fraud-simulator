name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Scaffold & Configure Build
        run: |
          flutter create --platforms=android --org com.cep.cybersafe .
          
          # Android permissions inject karein
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              c = f.read()
          perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          c = c.replace("<application", perms + "\n    <application")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(c)
          '
          
          # Core Library Desugaring & MultiDex inject karein (Regex se)
          python3 -c '
          import os, re
          
          files = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          target_file = next((f for f in files if os.path.exists(f)), None)
          if not target_file:
              raise FileNotFoundError("Gradle file nahi mili!")
          
          is_kts = target_file.endswith(".kts")
          with open(target_file, "r") as f:
              c = f.read()
          
          # compileOptions check & inject
          if re.search(r"compileOptions\s*\{", c):
              opt = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
              c = re.sub(r"(compileOptions\s*\{)", r"\1\n        " + opt, c)
          else:
              opt_block = "compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }" if is_kts else "compileOptions {\n        coreLibraryDesugaringEnabled true\n    }"
              c = re.sub(r"(android\s*\{)", r"\1\n    " + opt_block, c)
          
          # defaultConfig multiDex inject
          if re.search(r"defaultConfig\s*\{", c):
              md = "multiDexEnabled = true" if is_kts else "multiDexEnabled true"
              c = re.sub(r"(defaultConfig\s*\{)", r"\1\n        " + md, c)
          
          # dependencies block inject
          dep_line = "coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")" if is_kts else "coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\""
          if re.search(r"dependencies\s*\{", c):
              c = re.sub(r"(dependencies\s*\{)", r"\1\n    " + dep_line, c)
          else:
              c += f"\ndependencies {{\n    {dep_line}\n}}\n"
          
          # Ensure desugaring was added
          if "coreLibraryDesugaring" not in c:
              raise ValueError("Desugaring inject nahi ho payi!")
          
          with open(target_file, "w") as f:
              f.write(c)
          print(f"Successfully configured {target_file} with Core Library Desugaring!")
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Safe-CEP-App
          path: build/app/outputs/flutter-apk/app-release.apk
