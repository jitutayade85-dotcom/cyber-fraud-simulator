name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Scaffold & Configure Permissions
        run: |
          flutter create --platforms=android --org com.cep.cybersafe .
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              c = f.read()
          perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          if "RECEIVE_BOOT_COMPLETED" not in c:
              c = c.replace("<application", perms + "\n    <application")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(c)
          '

      - name: Enable Core Library Desugaring
        run: |
          python3 -c '
          import os

          # Modern Flutter (this project uses stable-3.47.5) generates
          # Kotlin DSL build files (build.gradle.kts) by default. Older
          # versions generated Groovy (build.gradle). Detect whichever
          # one actually exists instead of assuming.
          groovy_path = "android/app/build.gradle"
          kts_path = "android/app/build.gradle.kts"

          if os.path.exists(kts_path):
              path = kts_path
              is_kts = True
          elif os.path.exists(groovy_path):
              path = groovy_path
              is_kts = False
          else:
              raise FileNotFoundError("Neither build.gradle nor build.gradle.kts found under android/app/")

          with open(path, "r") as f:
              c = f.read()

          # Anchor on "android {" which always exists, instead of the
          # inner compileOptions block which may or may not be present
          # depending on the Flutter template version.
          if "coreLibraryDesugaringEnabled" not in c and "isCoreLibraryDesugaringEnabled" not in c:
              if is_kts:
                  block = "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8\n    }"
              else:
                  block = "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }"
              c = c.replace("android {", block, 1)

          # Append a fresh dependencies block at the end of the file.
          # Gradle allows multiple dependencies {} blocks in one file,
          # so this is safe even if one already exists.
          if "desugar_jdk_libs" not in c:
              if is_kts:
                  c += "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              else:
                  c += "\n\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n"

          with open(path, "w") as f:
              f.write(c)

          print(f"Patched: {path}")
          '

      - name: Debug - Print build.gradle
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            cat android/app/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Safe-CEP-App
          path: build/app/outputs/flutter-apk/app-release.apk