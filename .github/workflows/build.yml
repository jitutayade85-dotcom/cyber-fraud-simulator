name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Scaffold & Configure Permissions
        run: |
          flutter create --platforms=android --org com.cep.cybersafe .
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              c = f.read()
          perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          c = c.replace("<application", perms + "\n    <application")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(c)
          '

      - name: Enable Core Library Desugaring
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              c = f.read()
          if "coreLibraryDesugaringEnabled" not in c:
              c = c.replace(
                  "compileOptions {",
                  "compileOptions {\n        coreLibraryDesugaringEnabled true",
                  1
              )
          if "desugar_jdk_libs" not in c:
              c = c.replace(
                  "dependencies {",
                  "dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"",
                  1
              )
          with open(path, "w") as f:
              f.write(c)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Safe-CEP-App
          path: build/app/outputs/flutter-apk/app-release.apk